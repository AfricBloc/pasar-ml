name: CI/CD - Pasar ML Agents

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [xiara, shogun, resolute, xena]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint
        run: |
          cd ${{ matrix.agent }}
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics

      - name: Run tests
        run: |
          cd ${{ matrix.agent }}
          pytest --maxfail=3 --disable-warnings -q

shared-tests:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: Lint & test shared/
      run: |
        cd shared
        flake8 . --count --max-complexity=10 --max-line-length=120 --statistics
        pytest --maxfail=3 --disable-warnings -q

docker:
  needs: [test, shared-tests]
  runs-on: ubuntu-latest
  strategy:
    matrix:
      agent: [xiara, shogun, resolute, xena]

  permissions:
    packages: write
    contents: read

  steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.agent }}
        file: ./docker/${{ matrix.agent }}.Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/pasar-${{ matrix.agent }}:dev
          ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/pasar-{1}:latest', github.repository_owner, matrix.agent) || '' }}
